name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux-native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav libmpv-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-targets --all-features -- --nocapture
      - name: Compile the Solid-TV / Blits example application
        run: cargo check --manifest-path examples/solid-tv-blits-app/src-tauri/Cargo.toml --all-targets

  portable-api:
    strategy:
      matrix:
        platform: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install WebKitGTK
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets --no-default-features

  windows-native:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      GSTREAMER_VERSION: 1.28.6
      GSTREAMER_SHA256: 059251444d1267b486eba390b18d25fed87e10315e72f757ec6c7e912fa746b5
      GSTREAMER_ROOT: ${{ github.workspace }}\gstreamer
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache GStreamer installer
        id: cache-gstreamer
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\gstreamer-1.0-msvc-x86_64-${{ env.GSTREAMER_VERSION }}.exe
          key: gstreamer-msvc-x86_64-${{ env.GSTREAMER_VERSION }}
      - name: Download GStreamer
        if: steps.cache-gstreamer.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $installer = "$env:RUNNER_TEMP\gstreamer-1.0-msvc-x86_64-$env:GSTREAMER_VERSION.exe"
          Invoke-WebRequest "https://gstreamer.freedesktop.org/data/pkg/windows/$env:GSTREAMER_VERSION/msvc/gstreamer-1.0-msvc-x86_64-$env:GSTREAMER_VERSION.exe" -OutFile $installer
      - name: Install GStreamer runtime and development files
        shell: pwsh
        run: |
          $installer = "$env:RUNNER_TEMP\gstreamer-1.0-msvc-x86_64-$env:GSTREAMER_VERSION.exe"
          $actualHash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $env:GSTREAMER_SHA256) {
            throw "GStreamer installer checksum mismatch: $actualHash"
          }
          $process = Start-Process $installer -ArgumentList "/TYPE=devel", "/CURRENTUSER", "/DIR=$env:GSTREAMER_ROOT", "/VERYSILENT", "/NORESTART" -Wait -PassThru
          if ($process.ExitCode -notin 0, 3010) {
            throw "GStreamer installer failed with exit code $($process.ExitCode)"
          }
          "$env:GSTREAMER_ROOT\bin" | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
          "GSTREAMER_1_0_ROOT_MSVC_X86_64=$env:GSTREAMER_ROOT" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: Swatinem/rust-cache@v2
      - name: Compile the Windows GStreamer backend
        run: cargo test --all-targets --no-default-features --features gstreamer-runtime --no-run
      - name: Compile the Windows example application
        run: cargo check --manifest-path examples/tauri-app/src-tauri/Cargo.toml --all-targets
      - name: Compile the Windows Solid-TV / Blits example application
        run: cargo check --manifest-path examples/solid-tv-blits-app/src-tauri/Cargo.toml --all-targets

  guest-api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Verify the adapter bundle boundary
        run: |
          command -v grep >/dev/null
          if grep --recursive --line-number --extended-regexp \
            "mediabunny|@solidtv|react-dom|norigin-spatial" dist-js; then
            echo "The native adapter bundle contains DOM package implementation code"
            exit 1
          fi
      - run: npm pack --dry-run --ignore-scripts
      - name: Smoke-test packed ESM entrypoints
        run: |
          package_tarball=$(npm pack --silent --ignore-scripts)
          smoke_dir=$(mktemp -d)
          cd "$smoke_dir"
          npm init --yes >/dev/null
          npm install "$GITHUB_WORKSPACE/$package_tarball" >/dev/null
          node --input-type=module -e "await import('@get-air/video-tauri'); await import('@get-air/video-tauri/effect')"
      - run: npm ci
        working-directory: examples/tauri-app
      - run: npm run build
        working-directory: examples/tauri-app
      - run: npm ci
        working-directory: examples/solid-tv-blits-app
      - run: npm run build
        working-directory: examples/solid-tv-blits-app
