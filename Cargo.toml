[package]
name = "tauri-plugin-video"
version = "0.3.0"
authors = ["Air contributors"]
description = "Native video playback for Tauri using platform media engines"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
documentation = "https://docs.rs/tauri-plugin-video"
repository = "https://github.com/get-air/tauri-video-plugin"
homepage = "https://github.com/get-air/tauri-video-plugin"
keywords = ["tauri", "video", "gstreamer", "mkv", "android-tv"]
categories = ["multimedia::video", "api-bindings"]
exclude = [
  "/.github",
  "/.agents",
  "/.codebase-memory",
  "/.impeccable",
  "/AGENTS.md",
  "/CONTRIBUTING.md",
  "/adapter",
  "/android/.gradle",
  "/android/build",
  "/dist-js",
  "/docs",
  "/examples",
  "/guest-js",
  "/node_modules",
  "/package-lock.json",
  "/package.json",
  "/qualification",
  "/rollup.config.ts",
  "/runtime",
  "/scripts",
  "/tsconfig.json",
]
links = "tauri-plugin-video"

[features]
default = ["gstreamer-runtime"]
gstreamer-runtime = [
  "dep:gio",
  "dep:gstreamer",
  "dep:gstreamer-video",
]
mpv-runtime = ["dep:libc", "dep:libmpv2"]

[dependencies]
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.11.5" }
thiserror = "2"
tracing = "0.1"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21.1"

[target.'cfg(target_os = "linux")'.dependencies]
gio = { version = "0.22", optional = true }
gstreamer = { version = "0.25.3", optional = true }
gstreamer-video = { version = "0.25.3", optional = true }
gtk = "0.18.2"
libc = { version = "0.2", optional = true }
libmpv2 = { version = "5.0.3", default-features = true, optional = true }

[target.'cfg(windows)'.dependencies]
gio = { version = "0.22", optional = true }
gstreamer = { version = "0.25.3", optional = true }
gstreamer-video = { version = "0.25.3", optional = true }
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_SystemServices",
  "Win32_UI_HiDpi",
  "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
tauri-plugin = { version = "2.6.3", features = ["build"] }
