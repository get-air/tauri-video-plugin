[package]
name = "tauri-plugin-video"
version = "0.1.0"
authors = ["tauri-plugin-video contributors"]
description = "Realtime, CSS-native universal video playback for Tauri using GStreamer and MediaSource"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
documentation = "https://docs.rs/tauri-plugin-video"
repository = "https://github.com/vynxc/tauri-video-plugin"
homepage = "https://github.com/vynxc/tauri-video-plugin"
keywords = ["tauri", "video", "gstreamer", "mkv", "android-tv"]
categories = ["multimedia::video", "api-bindings"]
exclude = [
  "/.codebase-memory",
  "/.impeccable",
  "/android/.gradle",
  "/android/build",
  "/dist-js",
  "/examples",
  "/guest-js",
  "/node_modules",
  "/qualification/artifacts",
  "/qualification/certs",
  "/qualification/fixtures",
  "/qualification/server.jsonl",
  "/runtime",
]
links = "tauri-plugin-video"

[features]
default = ["gstreamer-runtime"]
gstreamer-runtime = [
  "dep:gio",
  "dep:gstreamer",
  "dep:gstreamer-app",
  "dep:gstreamer-pbutils",
]

[dependencies]
axum = { version = "0.8.9", features = ["http1", "json", "tokio"] }
bytes = "1.10"
gio = { version = "0.22", optional = true }
gstreamer = { version = "0.25.3", optional = true }
gstreamer-app = { version = "0.25.2", optional = true }
gstreamer-pbutils = { version = "0.25.2", optional = true }
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.11.5" }
thiserror = "2"
tokio = { version = "1.53.1", features = ["net", "rt", "sync", "time"] }
tracing = "0.1"
url = "2.5"
uuid = { version = "1.18", features = ["v4", "serde"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21.1"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18.2"

[build-dependencies]
tauri-plugin = { version = "2.6.3", features = ["build"] }

[dev-dependencies]
tempfile = "3.20"
